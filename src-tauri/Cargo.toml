[package]
name = "music-sweeper"
version = "0.1.0"
description = "Music Sweeper desktop application"
edition = "2021"

[lib]
name = "music_sweeper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"
