[package]
name = "hodomia"
version = "0.1.0"
description = "hodomia desktop application"
edition = "2021"

[lib]
name = "hodomia_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
xcap = "=0.9.8"
windows = { version = "0.62", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"
