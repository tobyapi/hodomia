name: Mac analysis
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      run-full-setup:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run-full-setup:
        description: 'Download and prepare all analysis models on Apple Silicon'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.22
      - run: sh -n scripts/setup-macos.sh
      - run: uv venv test-results/macos-venv --python 3.11
      - run: uv pip install --no-cache --python test-results/macos-venv/bin/python -r analysis/requirements.macos-arm64.lock.txt
      - run: test-results/macos-venv/bin/python -c "import torch, torchaudio, whisperx, beat_this, allin1_infer, demucs; print(torch.__version__)"
      - run: PYTHONUTF8=1 test-results/macos-venv/bin/python -m unittest discover -s analysis/tests -v

  chordmini-setup:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.22
      - run: sh scripts/setup-macos.sh test-results/chordmini-runtime chordmini
      - run: test -s test-results/chordmini-runtime/chordmini/installation.json
      - run: python scripts/smoke-chordmini-macos.py test-results/chordmini-runtime

  full-setup:
    if: inputs.run-full-setup
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.22
      - run: df -h .
      - run: sh scripts/setup-macos.sh test-results/full-runtime full
      - run: test -s test-results/full-runtime/ready.json
      - run: PYTHONUTF8=1 test-results/full-runtime/venv/bin/python scripts/smoke-analysis-macos.py test-results/full-runtime
      - run: PYTHONUTF8=1 test-results/full-runtime/venv/bin/python scripts/smoke-lyrics-macos.py test-results/full-runtime
