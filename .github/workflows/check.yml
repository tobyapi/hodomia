name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: check-${{ hashFiles('quality-gate.config.mjs') }}
          cache-on-failure: true
      - run: npm ci
      - run: npm run setup:quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install av==16.0.1 numpy==2.2.6 soundfile==0.13.1 librosa==0.11.0
      - run: npm run check
        env:
          HODOMIA_PYTHON: python
      - run: npm run tauri:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            test-results/quality-gate.json
            test-results/quality-metrics.json
