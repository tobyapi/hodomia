name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release/version.mjs

  check:
    needs: validate
    uses: ./.github/workflows/check.yml

  macos-dependencies:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            python-platform: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            python-platform: x86_64-apple-darwin
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.22
      - run: mkdir -p test-results && uv pip compile analysis/requirements.txt --python 3.11 --python-platform ${{ matrix.python-platform }} --output-file test-results/${{ matrix.platform }}.lock.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dependencies-${{ matrix.platform }}
          path: test-results/${{ matrix.platform }}.lock.txt
          if-no-files-found: error

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - run: npm ci
      - name: Build installers
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        env:
          NO_STRIP: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    needs: [validate, check, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded-artifacts
      - run: node scripts/release/assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
